name: Decode Tavern Scene API name

on:
  push:
    paths:
      - '.github/workflows/audit-tsp-api-name.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode static API strings
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/shaochami/chami_tavern-scene-plugin.git "$tmp/tsp"
          python - "$tmp/tsp/index.js" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8',errors='replace')
          def unesc(x):
              try:return bytes(x,'utf-8').decode('unicode_escape')
              except:return x
          # Decode hex escapes in a readable copy.
          d=re.sub(r'\\x([0-9a-fA-F]{2})',lambda m:chr(int(m.group(1),16)),s)
          out=['# Tavern Scene API static audit','',f'- size: {len(s)} bytes','']
          # Fold adjacent plain string literals several times.
          folded=d
          pat=re.compile(r"(['\"])([^'\"\\]{0,200})\1\s*\+\s*(['\"])([^'\"\\]{0,200})\3")
          for _ in range(12):
              new=pat.sub(lambda m:repr(m.group(2)+m.group(4)),folded)
              if new==folded:break
              folded=new
          strings=[]
          for m in re.finditer(r"(['\"])((?:\\.|(?!\1).){1,300})\1",folded):
              v=unesc(m.group(2))
              if v not in strings:strings.append(v)
          interesting=[x for x in strings if re.search(r'tsp|tavern|scene|generator|generate|imagegen|prompt|api|manager',x,re.I)]
          out+=['## Interesting decoded strings','```text',*interesting[:1200],'```','']
          for needle in ['GeneratorManager','processPromptWithAI','imageGen','registerModule','window[','globalThis[']:
              out += [f'## Context: {needle}','```javascript']
              start=0; count=0
              while True:
                  i=folded.find(needle,start)
                  if i<0 or count>=30:break
                  out.append(folded[max(0,i-1200):min(len(folded),i+2400)])
                  out.append('\n---\n');start=i+len(needle);count+=1
              if count==0:out.append('(none)')
              out += ['```','']
          # Extract likely assignments to window/globalThis and the variable used around GeneratorManager.
          out += ['## Global assignment candidates','```text']
          for m in re.finditer(r'(?:window|globalThis)\s*(?:\.[A-Za-z_$][\w$]*|\[[^\]]{1,160}\])\s*=',folded):
              out.append(folded[max(0,m.start()-160):min(len(folded),m.end()+500)].replace('\n',' '))
          out += ['```','']
          gi=folded.find('GeneratorManager')
          if gi>=0:
              prefix=folded[max(0,gi-50000):gi]
              vars=re.findall(r'([_$A-Za-z][\w$]*)\s*\[[^\]]+\]\s*=\s*\{\s*[\'\"]GeneratorManager',folded[max(0,gi-3000):gi+100])
              out += ['## Generator API container variables','```json',repr(vars),'```','']
              for v in vars:
                  out += [f'### Declaration/use contexts for {v}','```javascript']
                  positions=[m.start() for m in re.finditer(r'\b'+re.escape(v)+r'\b',folded)]
                  for pos in positions[:40]:out.append(folded[max(0,pos-500):min(len(folded),pos+900)]+'\n---\n')
                  out += ['```','']
          Path('TSP_API_STATIC_AUDIT.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit report and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/audit-tsp-api-name.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: decode Tavern Scene API name' || exit 0
          git push
