name: Audit phone chat and moments pages

on:
  push:
    paths:
      - '.github/workflows/audit-phone-app-pages.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: node tests/generate-stubs.mjs
      - name: Inspect app pages
        shell: bash
        run: |
          cat > tests/app-page-audit.mjs <<'EOF'
          import { writeFileSync } from 'node:fs';
          import { Window } from 'happy-dom';
          import jqueryFactory from 'jquery';
          import 'fake-indexeddb/auto';
          const report=['# Phone chat and moments runtime audit',''];
          const calls=[];
          let window;
          try {
            window=new Window({url:'http://localhost:8000/'}); const document=window.document;
            Object.assign(globalThis,{window,document,navigator:window.navigator,localStorage:window.localStorage,sessionStorage:window.sessionStorage,MutationObserver:window.MutationObserver,ResizeObserver:window.ResizeObserver,XMLHttpRequest:window.XMLHttpRequest,WebSocket:window.WebSocket,HTMLMediaElement:window.HTMLMediaElement,HTMLAudioElement:window.HTMLAudioElement,HTMLImageElement:window.HTMLImageElement,HTMLVideoElement:window.HTMLVideoElement,HTMLCanvasElement:window.HTMLCanvasElement,Audio:window.Audio,Image:window.Image,File:window.File,FileReader:window.FileReader,Blob:window.Blob,URL:window.URL,HTMLElement:window.HTMLElement,HTMLInputElement:window.HTMLInputElement,CustomEvent:window.CustomEvent,Event:window.Event,Node:window.Node,indexedDB:globalThis.indexedDB,IDBKeyRange:globalThis.IDBKeyRange});
            const $=jqueryFactory(window); globalThis.$=globalThis.jQuery=window.$=window.jQuery=$;
            const eventSource={on(...a){calls.push(['event.on',...a.map(String)])},off(){},emit(...a){calls.push(['event.emit',...a.map(String)])}};
            const stContext={name1:'Tester',name2:'Test Character',chatId:'smoke-chat',characterId:0,characters:[{name:'Test Character',avatar:'none'}],chat:[{is_user:false,name:'Test Character',mes:'她站在窗边微笑。'}],eventSource};
            window.SillyTavern=globalThis.SillyTavern={getContext:()=>stContext,getCurrentChatId:()=> 'smoke-chat'};
            window.toastr=globalThis.toastr={success:m=>calls.push(['success',String(m)]),info:m=>calls.push(['info',String(m)]),warning:m=>calls.push(['warning',String(m)]),error:m=>calls.push(['error',String(m)])};
            window.callPopup=globalThis.callPopup=async(...a)=>{calls.push(['popup',...a.map(String)]);return '一名角色站在窗边，电影感光影'};
            window.prompt=globalThis.prompt=(...a)=>{calls.push(['prompt',...a.map(String)]);return '一名角色站在窗边，电影感光影'};
            window.confirm=globalThis.confirm=()=>true; window.alert=globalThis.alert=()=>{};
            window.fetch=globalThis.fetch=async(...a)=>{calls.push(['fetch',String(a[0])]);return {ok:true,json:async()=>({}),text:async()=>'',blob:async()=>new Blob()}};
            await import('../phone-plugin.js');
            const deadline=Date.now()+12000; while(!window.ChamiPhoneEmulator?.instance&&Date.now()<deadline)await new Promise(r=>setTimeout(r,100));
            window.ChamiPhoneEmulator.open(); await new Promise(r=>setTimeout(r,300));
            const instance=window.ChamiPhoneEmulator.instance;
            report.push('## Instance methods','```text',...Object.getOwnPropertyNames(Object.getPrototypeOf(instance)).sort(),'```','');
            function snap(title){
              report.push(`## ${title}`,''); const root=document.querySelector('.tsp-phone-screen')||document.body;
              for(const el of [...root.querySelectorAll('button,[role="button"],input,textarea,[data-action],[data-app],a')]){const text=(el.textContent||el.value||el.placeholder||'').replace(/\s+/g,' ').trim();report.push(`- ${el.tagName} id=${el.id||'-'} class=${typeof el.className==='string'?el.className:'-'} app=${el.dataset?.app||'-'} action=${el.dataset?.action||'-'} text=${JSON.stringify(text.slice(0,220))}`)}
              report.push('','```html',root.innerHTML.slice(0,40000),'```','');
            }
            async function click(el,label){if(!el){report.push(`- CLICK ${label}: NOT FOUND`);return}report.push(`- CLICK ${label}: ${el.tagName}.${el.className||''}`);try{el.click();await new Promise(r=>setTimeout(r,600))}catch(e){report.push(`  ERROR: ${String(e?.stack||e)}`)}}
            for(const app of ['chat','moments']){
              if(!document.querySelector(`[data-app="${app}"]`)){instance.renderHomeScreen?.();await new Promise(r=>setTimeout(r,200))}
              await click(document.querySelector(`[data-app="${app}"]`),`app ${app}`); snap(`${app} initial`);
              const root=document.querySelector('.tsp-phone-screen');
              const candidates=[...root.querySelectorAll('[class*="item"],[class*="contact"],[class*="friend"],[class*="chat"]')].filter(el=>el.children.length&&el.getBoundingClientRect);
              const target=candidates.find(el=>/(Test Character|测试|好友|联系人)/.test(el.textContent||''))||candidates.find(el=>el.matches('[class*="item"],[class*="contact"]'));
              if(app==='chat'&&target){await click(target,'first chat/contact');snap('chat detail')}
              const imageControls=[...root.querySelectorAll('button,[role="button"],[data-action],div,span')].filter(el=>/(生成图片|图片生成|文生图|配图)/.test((el.textContent||'').replace(/\s+/g,' ')));
              report.push(`### ${app} image controls`,''); for(const el of imageControls)report.push(`- ${el.tagName} id=${el.id||'-'} class=${el.className||'-'} text=${JSON.stringify((el.textContent||'').replace(/\s+/g,' ').trim().slice(0,220))}`);
              if(imageControls[0]){await click(imageControls[0],`${app} image control`);snap(`${app} after image control`)}
              report.push('### Missing APIs after app','```json',JSON.stringify([...(window.__CHAMI_PHONE_MISSING_API_METHODS__||[])],null,2),'```','');
              const back=root.querySelector('.tsp-phone-nav-back,.tsp-phone-back-btn,[data-action="back"]'); if(back){await click(back,`${app} back`);await new Promise(r=>setTimeout(r,200))} else instance.renderHomeScreen?.();
            }
            report.push('## Calls','```json',JSON.stringify(calls,null,2),'```');
          }catch(error){report.push('## Fatal error','```text',String(error?.stack||error),'```',window?.document?.body?.innerHTML?.slice(0,50000)||'')}
          finally{writeFileSync('PHONE_APP_RUNTIME_AUDIT.md',report.join('\n'));try{window?.close()}catch{}}
          EOF
          node --experimental-loader ./tests/st-loader.mjs tests/app-page-audit.mjs || true
          rm -f tests/app-page-audit.mjs
      - name: Commit report and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/audit-phone-app-pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: audit chat and moments image controls' || exit 0
          git push
