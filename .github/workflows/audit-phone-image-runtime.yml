name: Audit phone image runtime

on:
  push:
    paths:
      - '.github/workflows/audit-phone-image-runtime.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: node tests/generate-stubs.mjs
      - name: Run resilient UI diagnostic
        shell: bash
        run: |
          cat > tests/runtime-image-audit.mjs <<'EOF'
          import { writeFileSync } from 'node:fs';
          import { Window } from 'happy-dom';
          import jqueryFactory from 'jquery';
          import 'fake-indexeddb/auto';
          const report=['# Phone image runtime audit',''];
          let window;
          try {
            window=new Window({url:'http://localhost:8000/'}); const document=window.document;
            Object.assign(globalThis,{window,document,navigator:window.navigator,localStorage:window.localStorage,sessionStorage:window.sessionStorage,MutationObserver:window.MutationObserver,ResizeObserver:window.ResizeObserver,XMLHttpRequest:window.XMLHttpRequest,WebSocket:window.WebSocket,HTMLMediaElement:window.HTMLMediaElement,HTMLAudioElement:window.HTMLAudioElement,HTMLImageElement:window.HTMLImageElement,HTMLVideoElement:window.HTMLVideoElement,HTMLCanvasElement:window.HTMLCanvasElement,Audio:window.Audio,Image:window.Image,File:window.File,FileReader:window.FileReader,Blob:window.Blob,URL:window.URL,HTMLElement:window.HTMLElement,HTMLInputElement:window.HTMLInputElement,CustomEvent:window.CustomEvent,Event:window.Event,Node:window.Node,indexedDB:globalThis.indexedDB,IDBKeyRange:globalThis.IDBKeyRange});
            const $=jqueryFactory(window); globalThis.$=globalThis.jQuery=window.$=window.jQuery=$;
            const eventSource={on(){},off(){},emit(){}};
            const stContext={name1:'Tester',name2:'Test Character',chatId:'smoke-chat',characterId:0,characters:[{name:'Test Character'}],chat:[{is_user:false,name:'Test Character',mes:'她站在窗边微笑。'}],eventSource};
            window.SillyTavern=globalThis.SillyTavern={getContext:()=>stContext,getCurrentChatId:()=> 'smoke-chat'};
            window.toastr=globalThis.toastr={success(){},info(){},warning(){},error(){}};
            window.callPopup=globalThis.callPopup=async()=>null;
            window.prompt=globalThis.prompt=()=> '一名角色站在窗边，电影感光影';
            window.confirm=globalThis.confirm=()=>true; window.alert=globalThis.alert=()=>{};
            window.fetch=globalThis.fetch=async()=>({ok:true,json:async()=>({}),text:async()=>'',blob:async()=>new Blob()});
            await import('../phone-plugin.js');
            const deadline=Date.now()+12000;
            while(!window.ChamiPhoneEmulator?.instance && Date.now()<deadline){await new Promise(r=>setTimeout(r,100))}
            report.push('## Initialization','',`- Status: ${JSON.stringify(window.__CHAMI_PHONE_STATUS__||null)}`,`- Instance: ${Boolean(window.ChamiPhoneEmulator?.instance)}`,'');
            window.ChamiPhoneEmulator?.open?.(); await new Promise(r=>setTimeout(r,500));
            const elements=[...document.querySelectorAll('button,[role="button"],input,textarea,[data-action],.tsp-phone-app,.tsp-phone-app-icon')];
            report.push('## Home controls','');
            for(const el of elements){const text=(el.textContent||el.value||el.placeholder||'').replace(/\s+/g,' ').trim();report.push(`- ${el.tagName} id=${el.id||'-'} class=${typeof el.className==='string'?el.className:'-'} action=${el.dataset?.action||'-'} text=${JSON.stringify(text.slice(0,180))}`)}
            report.push('','## Text-bearing elements','');
            for(const el of [...document.querySelectorAll('.tsp-phone-container *')]){const own=[...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim();if(own)report.push(`- ${el.tagName}.${typeof el.className==='string'?el.className:''}: ${JSON.stringify(own.slice(0,180))}`)}
            report.push('','## Missing APIs','```json',JSON.stringify([...(window.__CHAMI_PHONE_MISSING_API_METHODS__||[])],null,2),'```','','## Body','```html',document.body.innerHTML.slice(0,50000),'```');
          } catch(error) {
            report.push('','## Diagnostic error','```text',String(error?.stack||error),'```');
            if(window?.document) report.push('','## Body at failure','```html',window.document.body.innerHTML.slice(0,50000),'```');
          } finally {
            writeFileSync('PHONE_IMAGE_RUNTIME_AUDIT.md',report.join('\n'));
            try{window?.close()}catch{}
          }
          EOF
          node --experimental-loader ./tests/st-loader.mjs tests/runtime-image-audit.mjs || true
          rm -f tests/runtime-image-audit.mjs
      - name: Commit report and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/audit-phone-image-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: audit phone image runtime result' || exit 0
          git push
