name: Validate extension

on:
  pull_request:
  push:
    branches: [main, fix/load-failure]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run validate
      - run: npm run smoke
