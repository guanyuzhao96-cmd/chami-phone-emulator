name: Import standalone phone plugin

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[phone-imported]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch clean standalone phone working tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/guanyuzhao96-cmd/chami_tavern-scene-plugin.git /tmp/phone-source

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          cp -R /tmp/phone-source/Phone_emulator ./
          cp -R /tmp/phone-source/core ./
          cp -R /tmp/phone-source/styles ./
          cp /tmp/phone-source/manifest.json ./
          cp /tmp/phone-source/phone-plugin.js ./
          cp /tmp/phone-source/README.md ./
          cp /tmp/phone-source/CHARACTER_PROFILE.md ./
          if [ -f /tmp/phone-source/LICENSE ]; then cp /tmp/phone-source/LICENSE ./; fi

          rm -rf .github

      - name: Commit imported plugin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import clean standalone phone plugin [phone-imported]'
          git push origin main
